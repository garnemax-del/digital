        border-radius: 999px;
      }
      .lang button {
        padding: 7px 10px;
        border: 0;
        border-radius: 999px;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-weight: 700;
      }
      .lang button.active {
        color: var(--paper);
        background: var(--ink);
      }
      main {

        align-items: center;

        align-items: end;
      }
      .mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin-bottom: 28px;
        border-radius: 50%;
        color: var(--ink);
        background: var(--orange);
        font-size: 30px;
      }
      h1 {
        max-width: 850px;
        margin: 0;
        font-size: clamp(56px, 8.5vw, 124px);
        line-height: 0.88;
        letter-spacing: -0.078em;
      }
      h1 em {
        color: var(--orange);
        font-family: Georgia, serif;
        font-weight: 400;
      }
      .copy {
        max-width: 430px;
        color: #4f4a43;
        font-size: 20px;
        line-height: 1.48;
      }
      .btn {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 0 20px;
        border-radius: 999px;
        color: var(--paper);
        background: var(--ink);
        font-size: 14px;
        font-weight: 700;
      }
      footer {
        padding: 25px 0 34px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 760px) {
        .shell {
          width: calc(100% - 28px);
        }
        .success {
          grid-template-columns: 1fr;
          gap: 38px;
        }
        main {
          padding: 52px 0;
        }
        h1 {
          font-size: clamp(52px, 16vw, 76px);
        }
        .copy {
          font-size: 17px;
        }
      }
